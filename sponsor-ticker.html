<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squash Sponsor Ticker</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif}
#bar{position:absolute;left:0;right:0;bottom:0;height:var(--height,78px);display:flex;align-items:center;overflow:hidden;background:rgba(9,24,45,var(--opacity,.78));border-top:2px solid rgba(229,35,69,.8);box-shadow:0 -2px 12px rgba(0,0,0,.22)}
#bar[hidden]{display:none!important}#ticker{display:flex;width:max-content;align-items:center;white-space:nowrap;will-change:transform;animation:move var(--duration,35s) linear infinite}#ticker.pause{animation-play-state:paused}
.group{display:flex;align-items:center;flex:none;gap:46px;padding-right:46px}.sponsor{display:flex;align-items:center;justify-content:center;flex:none;min-width:150px;max-width:300px;height:calc(var(--height,78px) - 16px);padding:3px 8px;background:rgba(255,255,255,.95);border-radius:7px;color:#14243b;font-weight:800;font-size:21px}.sponsor.general{min-width:230px}.sponsor img{max-width:100%;max-height:100%;object-fit:contain}.sponsor span{white-space:nowrap}
@keyframes move{from{transform:translateX(0)}to{transform:translateX(-50%)}}
</style></head><body><div id="bar" hidden><div id="ticker"></div></div>
<script>
'use strict';
const q=new URLSearchParams(location.search),bar=document.getElementById('bar'),ticker=document.getElementById('ticker');
const disabled=['off','0','false','no'].includes((q.get('enabled')||'on').toLowerCase());
const safePath=s=>typeof s==='string'&&s.trim()&&!/^\s*(?:https?:|\/\/|data:|javascript:)/i.test(s)&&!s.includes('..')?s:null;
const entry=x=>typeof x==='string'?{image:x,name:''}:x&&typeof x==='object'?{image:x.image||x.src||'',name:x.name||''}:null;
let signature='';
function tile(raw,general){const e=entry(raw);if(!e||(!e.image&&!e.name))return null;const div=document.createElement('div');div.className='sponsor'+(general?' general':'');const path=safePath(e.image);if(path){const img=document.createElement('img');img.src=path;img.alt=e.name||'Sponsor';img.onerror=()=>{img.remove();if(e.name){const span=document.createElement('span');span.textContent=e.name;div.appendChild(span)}else{div.remove();updateVisibility()}};div.appendChild(img)}else{const span=document.createElement('span');span.textContent=e.name;div.appendChild(span)}return div}
function updateVisibility(){bar.hidden=disabled||!ticker.querySelector('.sponsor')}
function draw(c){if(disabled){bar.hidden=true;return}const items=[];if(c.generalSponsor)items.push({v:c.generalSponsor,g:true});for(const v of (Array.isArray(c.partners)?c.partners:[]))items.push({v,g:false});const valid=items.filter(x=>{const e=entry(x.v);return e&&(e.image||e.name)});if(!valid.length){ticker.replaceChildren();bar.hidden=true;signature='';return}
const speed=Math.min(200,Math.max(15,Number(c.speedPixelsPerSecond)||75)),height=Math.min(140,Math.max(40,Number(c.heightPx)||78)),opacity=Math.min(.98,Math.max(0,(c.backgroundOpacity==null?.78:Number(c.backgroundOpacity))));
const sig=JSON.stringify({valid,speed,height,opacity});if(sig===signature)return;signature=sig;bar.style.setProperty('--height',height+'px');bar.style.setProperty('--opacity',String(opacity));ticker.replaceChildren();
for(let k=0;k<2;k++){const group=document.createElement('div');group.className='group';for(const it of valid){const el=tile(it.v,it.g);if(el)group.appendChild(el)}ticker.appendChild(group)}updateVisibility();
// CSS marquee repeats two identical groups; duration follows measured group width.
requestAnimationFrame(()=>{const group=ticker.querySelector('.group');if(group){const distance=group.getBoundingClientRect().width;ticker.style.setProperty('--duration',(distance/speed).toFixed(2)+'s')}})
}
async function load(){if(disabled){bar.hidden=true;return}try{const r=await fetch('overlay-sponsors.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draw(await r.json())}catch(e){console.warn('Sponsor ticker:',e);bar.hidden=true}}
load();setInterval(load,60000);window.addEventListener('resize',()=>{signature='';load()});
</script></body></html>
