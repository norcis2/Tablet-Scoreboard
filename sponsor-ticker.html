<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squash Sponsor Ticker — Continuous</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif}
#bar{position:absolute;left:0;right:0;bottom:0;height:var(--height,78px);display:flex;align-items:center;overflow:hidden;background:rgba(9,24,45,var(--opacity,.78));border-top:2px solid rgba(229,35,69,.8);box-shadow:0 -2px 12px rgba(0,0,0,.22)}
#bar[hidden]{display:none!important}#ticker{display:flex;align-items:center;width:max-content;white-space:nowrap;will-change:transform;transform:translate3d(100vw,0,0)}
.group{display:flex;align-items:center;flex:none;gap:46px;padding-right:46px}.sponsor{display:flex;align-items:center;justify-content:center;flex:none;width:190px;height:calc(var(--height,78px) - 16px);padding:3px 8px;background:rgba(255,255,255,.95);border-radius:7px;color:#14243b;font-weight:800;font-size:21px;overflow:hidden}.sponsor.general{width:250px}.sponsor img{display:block;max-width:100%;max-height:100%;object-fit:contain}.sponsor span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div id="bar" hidden><div id="ticker"></div></div>
<script>
'use strict';
const q=new URLSearchParams(location.search),bar=document.getElementById('bar'),ticker=document.getElementById('ticker');
const disabled=['off','0','false','no'].includes((q.get('enabled')||'on').toLowerCase());
const safePath=s=>typeof s==='string'&&s.trim()&&!/^\s*(?:https?:|\/\/|data:|javascript:)/i.test(s)&&!s.includes('..')?s:null;
const entry=x=>typeof x==='string'?{image:x,name:''}:x&&typeof x==='object'?{image:x.image||x.src||'',name:x.name||''}:null;
let signature='',speed=75,cycleWidth=0,offset=0,lastFrame=0,frameId=0;
function tile(raw,general){const e=entry(raw);if(!e||(!e.image&&!e.name))return null;const div=document.createElement('div');div.className='sponsor'+(general?' general':'');const path=safePath(e.image);if(path){const img=document.createElement('img');img.src=path;img.alt=e.name||'Sponsor';img.onerror=()=>{img.remove();if(e.name){const span=document.createElement('span');span.textContent=e.name;div.appendChild(span)}else{div.style.visibility='hidden'}};div.appendChild(img)}else{const span=document.createElement('span');span.textContent=e.name;div.appendChild(span)}return div}
function animate(now){if(lastFrame){const dt=Math.min((now-lastFrame)/1000,.1);offset-=speed*dt;if(cycleWidth>0&&offset<=-cycleWidth){offset+=Math.ceil(-offset/cycleWidth)*cycleWidth}ticker.style.transform='translate3d('+offset.toFixed(2)+'px,0,0)'}lastFrame=now;frameId=requestAnimationFrame(animate)}
function stop(){if(frameId)cancelAnimationFrame(frameId);frameId=0;lastFrame=0}
function draw(c){if(disabled){stop();bar.hidden=true;return}const items=[];if(c.generalSponsor)items.push({v:c.generalSponsor,g:true});for(const v of(Array.isArray(c.partners)?c.partners:[]))items.push({v,g:false});const valid=items.filter(x=>{const e=entry(x.v);return e&&(e.image||e.name)});if(!valid.length){stop();ticker.replaceChildren();bar.hidden=true;signature='';return}
speed=Math.min(200,Math.max(15,Number(c.speedPixelsPerSecond)||75));const height=Math.min(140,Math.max(40,Number(c.heightPx)||78)),opacity=Math.min(.98,Math.max(0,c.backgroundOpacity==null?.78:Number(c.backgroundOpacity)));
const sig=JSON.stringify({valid,speed,height,opacity,viewport:window.innerWidth});if(sig===signature)return;signature=sig;stop();bar.style.setProperty('--height',height+'px');bar.style.setProperty('--opacity',String(opacity));ticker.replaceChildren();
function group(){const el=document.createElement('div');el.className='group';for(const it of valid){const t=tile(it.v,it.g);if(t)el.appendChild(t)}return el}
const first=group();ticker.appendChild(first);bar.hidden=false;
cycleWidth=first.getBoundingClientRect().width;
if(!cycleWidth){bar.hidden=true;return}
const copies=Math.max(3,Math.ceil(window.innerWidth/cycleWidth)+3);for(let i=1;i<copies;i++)ticker.appendChild(group());
// First logo starts beyond the right edge; after the first cycle the repeated groups align seamlessly.
offset=window.innerWidth;ticker.style.transform='translate3d('+offset+'px,0,0)';frameId=requestAnimationFrame(animate)
}
async function load(){if(disabled){stop();bar.hidden=true;return}try{const r=await fetch('overlay-sponsors.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draw(await r.json())}catch(e){console.warn('Sponsor ticker:',e);stop();bar.hidden=true}}
load();setInterval(load,60000);window.addEventListener('resize',()=>{signature='';load()});document.addEventListener('visibilitychange',()=>{lastFrame=0});
</script></body></html>
