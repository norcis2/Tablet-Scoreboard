<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squash Sponsor Ticker — Continuous v5</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Arial,Helvetica,sans-serif}
#bar{position:absolute;left:0;right:0;bottom:0;height:var(--height,78px);overflow:hidden;background:rgba(9,24,45,var(--opacity,.78));border-top:2px solid rgba(229,35,69,.8);box-shadow:0 -2px 12px rgba(0,0,0,.22)}
#bar[hidden]{display:none!important}#ticker{position:absolute;inset:0;overflow:hidden;contain:layout paint}
.sponsor{position:absolute;top:50%;display:flex;align-items:center;justify-content:center;width:190px;height:calc(var(--height,78px) - 16px);padding:3px 8px;background:rgba(255,255,255,.95);border-radius:7px;color:#14243b;font-weight:800;font-size:21px;overflow:hidden;will-change:transform;transform:translate3d(0,-50%,0)}
.sponsor.general{width:250px}.sponsor img{display:block;max-width:100%;max-height:100%;object-fit:contain}.sponsor span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><div id="bar" hidden><div id="ticker"></div></div>
<script>
'use strict';
const q=new URLSearchParams(location.search),bar=document.getElementById('bar'),ticker=document.getElementById('ticker');
const disabled=['off','0','false','no'].includes((q.get('enabled')||'on').toLowerCase());
const safePath=s=>typeof s==='string'&&s.trim()&&!/^\s*(?:https?:|\/\/|data:|javascript:)/i.test(s)&&!s.includes('..')?s:null;
const entry=x=>typeof x==='string'?{image:x,name:''}:x&&typeof x==='object'?{image:x.image||x.src||'',name:x.name||''}:null;
const GAP=18;
let signature='',speed=75,cycleWidth=0,positions=[],tiles=[],travel=0,lastFrame=0,frameId=0;
function tile(raw,general){const e=entry(raw);if(!e||(!e.image&&!e.name))return null;const div=document.createElement('div');div.className='sponsor'+(general?' general':'');const path=safePath(e.image);if(path){const img=document.createElement('img');img.src=path;img.alt=e.name||'Sponsor';img.onerror=()=>{img.remove();if(e.name){const span=document.createElement('span');span.textContent=e.name;div.appendChild(span)}else{div.style.visibility='hidden'}};div.appendChild(img)}else{const span=document.createElement('span');span.textContent=e.name;div.appendChild(span)}return div}
function stop(){if(frameId)cancelAnimationFrame(frameId);frameId=0;lastFrame=0}
function animate(now){if(lastFrame){const dt=Math.min((now-lastFrame)/1000,.1);travel=(travel+speed*dt)%cycleWidth}lastFrame=now;
// Each tile has a permanent slot in an endlessly repeated sequence. No group is removed or restarted.
for(let i=0;i<tiles.length;i++){const x=positions[i]-travel;tiles[i].style.transform='translate3d('+x.toFixed(2)+'px,-50%,0)'}
frameId=requestAnimationFrame(animate)}
function draw(c){if(disabled){stop();bar.hidden=true;return}const items=[];if(c.generalSponsor)items.push({v:c.generalSponsor,g:true});for(const v of(Array.isArray(c.partners)?c.partners:[]))items.push({v,g:false});const valid=items.filter(x=>{const e=entry(x.v);return e&&(e.image||e.name)});if(!valid.length){stop();ticker.replaceChildren();bar.hidden=true;signature='';return}
speed=Math.min(200,Math.max(15,Number(c.speedPixelsPerSecond)||75));const height=Math.min(140,Math.max(40,Number(c.heightPx)||78)),opacity=Math.min(.98,Math.max(0,c.backgroundOpacity==null?.78:Number(c.backgroundOpacity)));
const sig=JSON.stringify({valid,speed,height,opacity,viewport:window.innerWidth});if(sig===signature)return;signature=sig;stop();bar.style.setProperty('--height',height+'px');bar.style.setProperty('--opacity',String(opacity));ticker.replaceChildren();tiles=[];positions=[];
const widths=valid.map(x=>x.g?250:190);const starts=[];let sum=0;for(let i=0;i<valid.length;i++){starts.push(sum);sum+=widths[i]+GAP}cycleWidth=sum;
// Build enough repeated individual tiles to cover the entire viewport even at the wrap point.
const count=Math.ceil(window.innerWidth/cycleWidth)+3;
for(let repeat=-1;repeat<=count;repeat++){for(let j=0;j<valid.length;j++){const el=tile(valid[j].v,valid[j].g);if(!el)continue;ticker.appendChild(el);tiles.push(el);positions.push(repeat*cycleWidth+starts[j])}}
travel=0;lastFrame=0;bar.hidden=false;frameId=requestAnimationFrame(animate)
}
async function load(){if(disabled){stop();bar.hidden=true;return}try{const r=await fetch('overlay-sponsors.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);draw(await r.json())}catch(e){console.warn('Sponsor ticker:',e);if(!signature){stop();bar.hidden=true}}}
load();setInterval(load,60000);window.addEventListener('resize',()=>{signature='';load()});document.addEventListener('visibilitychange',()=>{lastFrame=0});
</script></body></html>
