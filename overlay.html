<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Squash Broadcast Overlay</title>
<style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;color:white}#wrap{position:absolute;top:2.2%;left:50%;transform:translateX(-50%);width:min(720px,94vw);display:flex;flex-direction:column;gap:5px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}.glass{background:rgba(9,24,45,.77);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);border-radius:9px}.head{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:48px}.org{display:flex;align-items:center;gap:7px}.org img{height:31px;max-width:75px;object-fit:contain}.event{font-size:15px;font-weight:800;letter-spacing:.035em;flex:1;min-width:0}.court{font-size:13px;font-weight:800;white-space:nowrap;color:#d7e4f4}.score{padding:6px 10px;display:flex;flex-direction:column;gap:4px}.player{display:grid;grid-template-columns:minmax(0,1fr) 58px repeat(5,34px) 50px;align-items:center;min-height:43px;gap:3px}.name{font-size:19px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px}.serving .name{border-left:4px solid #f13958;padding-left:4px}.point{background:rgba(244,248,255,.13);border-radius:5px;font-size:26px;font-weight:900;text-align:center;padding:5px 0}.serving .point{background:rgba(224,25,65,.95)}.game{text-align:center;color:#edf3fa;font-size:14px;font-weight:700}.game.won{color:#fff;background:rgba(224,25,65,.45);border-radius:4px;padding:5px 0}.games{font-size:21px;font-weight:900;text-align:center;color:#fff}.labels{display:grid;grid-template-columns:minmax(0,1fr) 58px repeat(5,34px) 50px;gap:3px;color:#b9cde5;font-size:10px;text-align:center;letter-spacing:.05em}.labels div:first-child{text-align:left;padding-left:8px}.sponsors{display:flex;gap:5px;min-height:48px;padding:4px}.sponsors[hidden]{display:none}.tile{background:rgba(246,248,252,.9);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:1;min-width:0;height:40px;padding:4px;color:#172a46;font-size:14px;font-weight:800;text-align:center}.tile img{width:100%;height:100%;object-fit:contain}.tile.general{flex:1.15}.tile.alone{flex:1}.message{text-align:center;font-weight:800;font-size:20px;padding:18px 12px}.status{font-size:10px;color:#ffe3e8;text-align:right;min-height:0}.status:empty{display:none}@media(max-width:700px){.player{grid-template-columns:minmax(0,1fr) 48px repeat(5,29px) 40px}.labels{grid-template-columns:minmax(0,1fr) 48px repeat(5,29px) 40px}.name{font-size:15px}.point{font-size:20px}.game{font-size:12px}.games{font-size:18px}.event{font-size:13px}}
</style></head><body><div id="wrap"><div class="glass head"><div class="org" id="organizers"></div><div class="event" id="event">SQUASH TOURNAMENT</div><div class="court" id="court">COURT 1</div></div><div class="glass score" id="score"><div class="message">Connecting…</div></div><div class="glass sponsors" id="sponsors" hidden></div><div class="status" id="status"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),slot=params.get('court')||'1',hideSponsors=params.get('sponsors')==='off',demo=params.get('demo'),CONFIG_INTERVAL=60000;
let api={apiBaseUrl:'https://live.rankedin.com/api/v1',refreshSeconds:5,courts:{'1':192806}},rankedinId=null,tournament={},sponsorConfig={},sponsorEpoch=Date.now(),lastSignature='',latest=null,lastLive=null,finalUntil=0,finalId=null,pollBusy=false,configReady=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const name=x=>{const p=Array.isArray(x)?x[0]:x;return [p?.firstName,p?.middleName,p?.lastName].filter(Boolean).join(' ')||'PLAYER'};
const safePath=s=>typeof s==='string'&&!/^\s*(?:https?:|\/\/|data:|javascript:)/i.test(s)&&!s.includes('..')?s:null;
const entry=x=>typeof x==='string'?{image:x,name:''}:x&&typeof x==='object'?{image:x.image||x.src||'',name:x.name||''}:null;
function image(path,alt){const src=safePath(path);if(!src)return null;const img=document.createElement('img');img.src=src;img.alt=alt||'';return img}
async function json(path){const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.json()}
function applyTournament(){ $('event').textContent=tournament.tournamentName||'SQUASH TOURNAMENT';const host=$('organizers');host.replaceChildren();for(const v of (Array.isArray(tournament.organizers)?tournament.organizers:[]).slice(0,3)){const e=entry(v);const img=e&&image(e.image,e.name||'Organizer');if(img)host.appendChild(img)}}
function sponsorTile(v,general=false,alone=false){const e=entry(v);if(!e)return null;const div=document.createElement('div');div.className='tile'+(general?' general':'')+(alone?' alone':'');const img=image(e.image,e.name||'Sponsor');if(img){img.onerror=()=>{img.remove();div.textContent=e.name||''};div.appendChild(img)}else if(e.name)div.textContent=e.name;else return null;return div}
function ms(x){return Math.max(3,Math.min(120,Number(x)||10))*1000}
function showSponsors(){const host=$('sponsors');if(hideSponsors){host.hidden=true;host.replaceChildren();return}const g=entry(sponsorConfig.generalSponsor),partners=(Array.isArray(sponsorConfig.partners)?sponsorConfig.partners:[]).map(entry).filter(e=>e&&(e.image||e.name));if(!g&&!partners.length){host.hidden=true;host.replaceChildren();lastSignature='';return}const elapsed=Date.now()-sponsorEpoch,genMs=ms(sponsorConfig.generalSeconds),rotMs=ms(sponsorConfig.rotationSeconds);let items=[];if(g){if(!partners.length)items=[{v:g,g:true,alone:true}];else{const groups=Math.ceil(partners.length/3),phase=elapsed%(genMs+groups*rotMs);items=phase<genMs?[{v:g,g:true,alone:true}]:[{v:g,g:true},...partners.slice(Math.floor((phase-genMs)/rotMs)*3,Math.floor((phase-genMs)/rotMs)*3+3).map(v=>({v}))]}}else{const groups=Math.ceil(partners.length/4),page=Math.floor(elapsed/rotMs)%groups;items=partners.slice(page*4,page*4+4).map(v=>({v}))}const signature=JSON.stringify(items);if(signature===lastSignature)return;lastSignature=signature;host.replaceChildren();for(const i of items){const tile=sponsorTile(i.v,i.g,i.alone);if(tile)host.appendChild(tile)}host.hidden=host.children.length===0}
async function configs(){try{const c=await json('api-config.json');if(c&&c.courts&&typeof c.courts==='object')api=c}catch(e){console.warn(e)}rankedinId=api.courts?.[slot]==null?null:String(api.courts[slot]);configReady=true;try{tournament=await json('tournament.json');applyTournament()}catch(e){console.warn(e)}if(!hideSponsors){try{const s=await json('overlay-sponsors.json');if(JSON.stringify(s)!==JSON.stringify(sponsorConfig)){sponsorConfig=s;sponsorEpoch=Date.now();lastSignature=''}}catch(e){sponsorConfig={generalSponsor:null,partners:[]};lastSignature='';console.warn(e)}}showSponsors()}
function row(player,points,sets,won,serve,other){const cells=Array.from({length:5},(_,i)=>{const v=sets?.[i],o=other?.[i],victory=v!=null&&o!=null&&Number(v)>Number(o)&&Number(v)>=11&&Number(v)-Number(o)>=2;return `<div class="game${victory?' won':''}">${esc(v??'–')}</div>`}).join('');return `<div class="player${serve?' serving':''}"><div class="name" title="${esc(name(player))}">${esc(name(player))}</div><div class="point">${esc(points)}</div>${cells}<div class="games">${esc(won)}</div></div>`}
function renderRows(a,b,ap,bp,as,bs,aw,bw,serve){$('score').innerHTML='<div class="labels"><div>PLAYER</div><div>POINTS</div><div>G1</div><div>G2</div><div>G3</div><div>G4</div><div>G5</div><div>GAMES</div></div>'+row(a,ap,as,aw,serve===true,bs)+row(b,bp,bs,bw,serve===false,as)}
function label(d,s){const raw=d?.details?.courtName||'CT'+slot,m=String(raw).match(/^(?:CT|COURT)\s*(\d+)$/i);$('court').textContent=(m?'COURT '+m[1]:String(raw).toUpperCase())+(s?' · '+s:'')}
function draw(d){const live=d.liveMatch,prev=d.previousMatch,next=d.nextMatch,now=Date.now();if(live){const base=live.base||live,st=live.state||live,sc=st.score||{},sets=Array.isArray(sc.detailedResult)?sc.detailedResult:[],current=sets.at(-1)||{};const index=Number(sc.index);const game=Number.isFinite(index)?Math.min(5,Math.max(1,index+1)):Math.max(1,sets.length);label(d,'GAME '+game+' · BEST OF 5');renderRows(base.firstParticipant,base.secondParticipant,current.firstParticipantScore??'–',current.secondParticipantScore??'–',sets.map(x=>x.firstParticipantScore),sets.map(x=>x.secondParticipantScore),sc.firstParticipantScore??0,sc.secondParticipantScore??0,st.serve?.isFirstParticipantServing);lastLive=String(base.matchId||'');finalUntil=0;finalId=null;return}if(lastLive&&prev&&String(prev.matchId)===lastLive){finalId=lastLive;finalUntil=now+60000}lastLive=null;if(prev&&String(prev.matchId)===finalId&&now<finalUntil){const sc=prev.score||{},sets=sc.detailedResult||[];label(d,'FINAL RESULT');renderRows(prev.firstParticipant,prev.secondParticipant,'–','–',sets.map(x=>x.firstParticipantScore),sets.map(x=>x.secondParticipantScore),sc.firstParticipantScore??'–',sc.secondParticipantScore??'–',null);return}if(next){label(d,'NEXT MATCH');renderRows(next.firstParticipant,next.secondParticipant,'–','–',[],[],'–','–',null);return}label(d,'COURT AVAILABLE');$('score').innerHTML='<div class="message">COURT AVAILABLE</div>'}
const demoData={details:{courtName:'CT1'},liveMatch:{base:{matchId:1001,firstParticipant:[{firstName:'Olivers',lastName:'Felšs'}],secondParticipant:[{firstName:'Kārlis',lastName:'Martinsons'}]},state:{serve:{isFirstParticipantServing:true},score:{index:2,firstParticipantScore:1,secondParticipantScore:1,detailedResult:[{firstParticipantScore:11,secondParticipantScore:7},{firstParticipantScore:8,secondParticipantScore:11},{firstParticipantScore:6,secondParticipantScore:4}]}}},previousMatch:null,nextMatch:null};
async function poll(){if(pollBusy||!configReady)return;if(!rankedinId&&!demo){$('score').innerHTML='<div class="message">COURT '+esc(slot)+' — NOT CONFIGURED</div>';return}pollBusy=true;try{let d;if(demo==='live')d=demoData;else if(demo==='next')d={...demoData,liveMatch:null,nextMatch:{firstParticipant:demoData.liveMatch.base.firstParticipant,secondParticipant:demoData.liveMatch.base.secondParticipant}};else{const base=String(api.apiBaseUrl||'https://live.rankedin.com/api/v1').replace(/\/+$/,'');const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),10000);let r;try{r=await fetch(base+'/court/'+encodeURIComponent(rankedinId)+'/scoreboard?t='+Date.now(),{cache:'no-store',signal:ctl.signal})}finally{clearTimeout(timer)}if(!r.ok)throw Error('HTTP '+r.status);d=await r.json()}if(!d||typeof d!=='object'||!('liveMatch'in d))throw Error('Unexpected API format');latest=d;draw(d);$('status').textContent=''}catch(e){console.warn('Overlay:',e);$('status').textContent='Connection error';if(!latest)$('score').innerHTML='<div class="message">WAITING FOR CONNECTION</div>'}finally{pollBusy=false}}
(async()=>{await configs();await poll();setInterval(configs,CONFIG_INTERVAL);let last=Date.now();setInterval(()=>{showSponsors();const now=Date.now(),interval=Math.max(2,Number(api.refreshSeconds)||5)*1000;if(now-last>=interval){last=now;poll()}if(latest)draw(latest)},1000)})();
</script></body></html>
