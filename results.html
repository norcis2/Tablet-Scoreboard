<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament Live Center</title><style>
:root{font-family:Arial,sans-serif;color:#f4f8ff;background:#0b1422}*{box-sizing:border-box}body{margin:0;padding:2vw}header,footer,.top{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:22px;min-width:0}.brand-logos{display:flex;align-items:center;gap:12px;flex-shrink:0}.brand-logos img{height:70px;max-width:150px;object-fit:contain}.brand-title{min-width:0}header{border-bottom:1px solid #304259;padding-bottom:16px;margin-bottom:20px}h1{font-size:clamp(24px,3vw,52px);margin:5px 0}h2{font-size:clamp(20px,2vw,32px)}small,.muted{color:#a8bed5}.pill{background:#194a39;color:#92f2c2;padding:9px 16px;border-radius:18px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.court,.panel{background:#17263a;border:1px solid #2a4059;border-radius:13px;padding:20px}.court h3{margin:0 0 18px;color:#b4d0ec}.names{display:grid;grid-template-columns:1fr auto;gap:14px;font-size:clamp(16px,1.6vw,29px)}.score{font-weight:800}.points{font-size:clamp(20px,2.6vw,42px);text-align:center;color:#f7ce68;margin-top:12px}.state{font-size:13px;color:#a8bed5;text-transform:uppercase}.panel{margin-top:20px}.entry{display:grid;grid-template-columns:90px 1fr auto;gap:15px;padding:12px 0;border-bottom:1px solid #33475e;font-size:clamp(16px,1.35vw,24px)}.entry:last-child{border:0}.hide{display:none}footer{margin-top:20px;color:#9cb4cc;font-size:14px}button{border:1px solid #405873;background:#243c56;color:white;padding:10px 14px;border-radius:8px;cursor:pointer}@media(max-width:900px){.brand-logos img{height:52px;max-width:105px}.brand{gap:12px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header{flex-wrap:wrap}.brand{flex-wrap:wrap}.brand-logos img{height:45px}.grid{grid-template-columns:1fr}.entry{grid-template-columns:60px 1fr auto}}

/* Television layout: one section per screen, with fixed viewport height. */
html,body{height:100%;overflow:hidden}
body{height:100dvh;padding:clamp(8px,1.1vh,16px);display:flex;flex-direction:column;gap:0}
header{flex:0 0 auto;margin:0 0 8px;padding:0 0 8px;gap:10px;min-height:0}
.brand{gap:12px}.brand-logos{gap:8px}.brand-logos img{height:clamp(38px,6.4vh,68px);max-width:125px}
h1{font-size:clamp(20px,2.5vw,42px);margin:2px 0}header small{font-size:11px}
header .pill{padding:5px 10px;font-size:12px}header .muted{margin:5px 0;font-size:12px}button{padding:6px 10px}
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
main>section{flex:1 1 auto;min-height:0;overflow:hidden}
main>section.hide{display:none!important}
h2{font-size:clamp(19px,2.1vw,30px);margin:0 0 10px}
#live{display:flex;flex-direction:column}
.grid{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(6px,0.8vh,12px);align-content:stretch}
.court{padding:clamp(8px,1.2vh,15px);min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:clamp(3px,0.5vh,8px)}
.court h3{margin:0;font-size:clamp(15px,1.4vw,23px)}.state{font-size:clamp(10px,0.9vw,13px)}
.names{font-size:clamp(13px,1.3vw,23px);gap:clamp(3px,0.5vh,8px) 8px;min-height:0;overflow:hidden;line-height:1.15;align-items:start}
.names span:not(.score){overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.points{font-size:clamp(17px,2vw,32px);margin-top:auto;line-height:1.1}
.panel{margin-top:0;padding:clamp(10px,1.5vh,20px);display:flex;flex-direction:column}
.panel .top{gap:8px}.panel .top h2{margin:0}.panel>h2{margin-bottom:8px}
#resultRows,#scheduleRows{flex:1 1 auto;min-height:0;overflow:hidden}
.entry{grid-template-columns:clamp(68px,8vw,120px) minmax(0,1fr) auto;gap:12px;padding:clamp(7px,1vh,13px) 0;font-size:clamp(14px,1.5vw,23px);line-height:1.2;min-height:0}
.entry>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{flex:0 0 auto;margin-top:7px;padding-top:6px;border-top:1px solid #304259;font-size:clamp(10px,1vw,14px);gap:8px}
.page-indicator{color:#a8bed5;font-size:clamp(12px,1vw,16px);margin-left:auto;white-space:nowrap}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}}
@media(max-width:600px){header{flex-wrap:nowrap}.brand{flex-wrap:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.entry{grid-template-columns:62px minmax(0,1fr) auto}}
#groupRows{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px}.group-table{width:100%;border-collapse:collapse;font-size:clamp(12px,1.35vw,23px)}.group-table td,.group-table th{padding:clamp(3px,.65vh,9px);border-bottom:1px solid #33475e;text-align:center}.group-table td:nth-child(2),.group-table th:nth-child(2){text-align:left}.group-table th{color:#a8bed5}.group-title{font-size:clamp(15px,1.6vw,26px);margin:4px 0;color:#b4d0ec}.group-table tr:first-child td:first-child{color:#92f2c2}#tvAd{flex:none;height:clamp(45px,9vh,110px);margin-top:7px;text-align:center}#tvAd img{height:100%;max-width:100%;object-fit:contain}#tvAd.hide{display:none}.entry .winner{color:#92f2c2}.entry small{font-size:.72em}.entry>span{white-space:normal}</style></head><body><header><div class="brand"><div id="organizers" class="brand-logos"></div><div class="brand-title"><small>TOURNAMENT INFORMATION SYSTEM</small><h1 id="title">SQUASH LIVE CENTER</h1></div></div><div><span class="pill">● LIVE</span><p class="muted" id="status">Connecting…</p><button id="full">Fullscreen</button></div></header><main><section id="live"><h2>LIVE COURTS</h2><div class="grid" id="courts"></div></section><section class="panel hide" id="results"><div class="top"><h2>MATCH RESULTS</h2><small><span id="resultSource">Court feed</span></small><span class="page-indicator" id="resultsPage"></span></div><div id="resultRows"></div></section><section class="panel hide" id="schedule"><div class="top"><h2>UPCOMING MATCHES</h2><span class="page-indicator" id="schedulePage"></span></div><div id="scheduleRows"></div></section><section class="panel hide" id="groups"><div class="top"><h2>GROUP STANDINGS</h2><span class="page-indicator" id="groupsPage"></span></div><div id="groupRows"></div></section></main><div id="tvAd" class="hide"><img alt="Advertisement"></div><footer><span>TOURNAMENT LIVE CENTER</span><span>POWERED BY RANKEDIN · <span id="clock"></span></span></footer><script>
'use strict';
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let config=null,records=new Map(),mode=0,rotation=true,resultsItems=[],scheduleItems=[],pageIndex={results:0,schedule:0},lastActive=[];
const name=p=>{const v=(Array.isArray(p)?p:p?[p]:[]).map(x=>typeof x==='string'?x:([x.firstName,x.middleName,x.lastName].filter(Boolean).join(' ')||x.name||x.fullName||'')).filter(Boolean).join(' / ').trim();return !v||/^(TBA|Pending)$/i.test(v)?'To Be Announced':v};
const matchBase=m=>m?.base||m||{};
const matchScore=m=>m?.state?.score||m?.score||{};
const score=m=>{const sc=matchScore(m);return sc.firstParticipantScore!=null||sc.secondParticipantScore!=null?`${sc.firstParticipantScore??0}–${sc.secondParticipantScore??0}`:'—'};
const row=(c,m,suffix='')=>{const b=matchBase(m);return `<div class="entry"><b>Court ${safe(c)}</b><span>${safe(b.className||'')} · ${safe(name(b.firstParticipant))} — ${safe(name(b.secondParticipant))}</span><b>${safe(suffix||score(m))}</b></div>`};
async function init(){try{const [a,t]=await Promise.all([fetch('api-config.json?x='+Date.now(),{cache:'no-store'}),fetch('tournament.json?x='+Date.now(),{cache:'no-store'})]);if(!a.ok)throw Error('Configuration unavailable');config=await a.json();if(t.ok){const info=await t.json();$('title').textContent=info.tournamentName||'SQUASH LIVE CENTER';const logos=Array.isArray(info.organizers)?info.organizers:[];$('organizers').innerHTML=logos.map(x=>{const path=typeof x==='string'?x:x?.image||x?.logo||'';return path?`<img src="${safe(path)}" alt="Organizer">`:''}).join('')}startDraws();startAds();refresh();setInterval(refresh,Math.max(3,Number(config.refreshSeconds)||5)*1000)}catch(e){$('status').textContent=e.message}}
let courtBusy=false;async function refresh(){if(courtBusy)return;courtBusy=true;try{const active=Object.entries(config.courts||{}).filter(([,id])=>id!==null&&id!==undefined&&id!=='');let errors=0;await Promise.all(active.map(async([court,id])=>{try{const r=await fetch(`${String(config.apiBaseUrl).replace(/\/$/,'')}/court/${encodeURIComponent(id)}/scoreboard?t=${Date.now()}`,{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error(r.status);records.set(court,await r.json())}catch(e){errors++}}));render(active);$('status').textContent=`Updated ${new Date().toLocaleTimeString()} · ${errors?errors+' court(s) unavailable':'All connected'}`}finally{courtBusy=false}}
function render(active){$('courts').innerHTML=active.map(([court])=>{const d=records.get(court),m=d?.liveMatch||d?.nextMatch||d?.previousMatch,b=matchBase(m),sc=matchScore(m);const state=d?.liveMatch?'PLAYING':d?.nextMatch?'NEXT MATCH':d?.previousMatch?'FINISHED':'COURT AVAILABLE';const games=Array.isArray(sc.detailedResult)?sc.detailedResult:[];const current=games.at(-1)||{};return `<article class="court"><h3>COURT ${safe(court)}</h3><div class="state">${state}${!d?' · NO DATA':''}</div>${m?`<div class="names"><span>${safe(name(b.firstParticipant))}</span><span class="score">${safe(d?.nextMatch===m?'–':sc.firstParticipantScore??'–')}</span><span>${safe(name(b.secondParticipant))}</span><span class="score">${safe(d?.nextMatch===m?'–':sc.secondParticipantScore??'–')}</span></div><div class="points">${d?.liveMatch?`${safe(current.firstParticipantScore??'–')} : ${safe(current.secondParticipantScore??'–')}`:''}</div>`:''}</article>`}).join('')||'<p>No courts configured</p>';
const seen=new Set(),results=[],upcoming=[];for(const [court] of active){const d=records.get(court);if(d?.previousMatch){const m=d.previousMatch,b=matchBase(m),k=b.matchId??`${court}-${name(b.firstParticipant)}-${name(b.secondParticipant)}`;if(!seen.has(k)){seen.add(k);results.push(row(court,m))}}if(d?.nextMatch)upcoming.push(row(court,d.nextMatch,'NEXT'))}if(!drawReady){for(const [court] of active){const m=records.get(court)?.previousMatch;if(m){const b=matchBase(m);courtHistory.set(b.matchId??`${court}-${name(b.firstParticipant)}-${name(b.secondParticipant)}`,row(court,m));}}resultsItems=[...courtHistory.values()].reverse();scheduleItems=upcoming;}lastActive=active;drawPaged('results');drawPaged('schedule')}

function drawPaged(section){
 const items=section==='results'?resultsItems:scheduleItems;
 const host=$(section==='results'?'resultRows':'scheduleRows');
 const indicator=$(section==='results'?'resultsPage':'schedulePage');
 const available=Math.max(100,host.clientHeight||window.innerHeight*0.68);
 // Calculate row height from the actual CSS rather than a fixed resolution.
 const probe=document.createElement('div');probe.className='entry';probe.style.visibility='hidden';
 probe.innerHTML='<b>Court 1</b><span>Sample participant — Sample participant</span><b>3–2</b>';
 host.appendChild(probe);const height=Math.max(32,probe.getBoundingClientRect().height||48);probe.remove();
 const perPage=Math.max(1,Math.floor(available/height));
 const pages=Math.max(1,Math.ceil(items.length/perPage));pageCounts[section]=pages;
 pageIndex[section]=pageIndex[section]%pages;
 const start=pageIndex[section]*perPage;
 host.innerHTML=items.length?items.slice(start,start+perPage).join(''):'<p class="muted">'+(section==='results'?'No recent results available':'No upcoming matches available')+'</p>';
 indicator.textContent=pages>1?`PAGE ${pageIndex[section]+1} / ${pages}`:'';
}
function sections(){const v=new URLSearchParams(location.search).get('view');return ['live','results','groups','schedule'].includes(v)?[v]:['live','results',...(config?.groupStandings?.enabled===false?[]:['groups']),'schedule'];}
function show(){const ids=sections();mode%=ids.length;for(const id of ['live','results','groups','schedule'])$(id).classList.toggle('hide',id!==ids[mode]);if(ids[mode]==='groups')drawGroups();else if(ids[mode]!=='live')drawPaged(ids[mode]);}
function rotate(){const ids=sections(),current=ids[mode];if(current==='groups'&&groupPage+1<groupPages.length){groupPage++;drawGroups();return;}if(current==='results'||current==='schedule'){if(pageIndex[current]+1<(pageCounts[current]||1)){pageIndex[current]++;drawPaged(current);return;}pageIndex[current]=0;}groupPage=0;mode=(mode+1)%ids.length;show();}
setInterval(rotate,20000);
window.addEventListener('resize',()=>show());$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('clock').textContent=new Date().toLocaleString();setInterval(()=>$('clock').textContent=new Date().toLocaleString(),1000);
const courtHistory=new Map(),pageCounts={};let drawReady=false,drawBusy=false,groupPages=[],groupPage=0,drawError='Waiting for Draws API';
const players=p=>(p?.Players||[p?.FirstPlayer,p?.SecondPlayer]).map(x=>x?.Name).filter(Boolean).join(' / ');
function parseDraws(cls,draw,items,groups,matches){
 function add(m,a,b,r,court){if(!m?.MatchId||!a||!b)return;matches.set(String(m.MatchId),{id:m.MatchId,a,b,r,date:m.Date,court:court||'',category:cls.Name,stage:draw.Name});}
 for(const item of items){const rr=item.RoundRobin;if(rr){if(rr.Standings?.length)groups.push({title:cls.Name+' · '+rr.Name,rows:[...rr.Standings].sort((a,b)=>a.Standing-b.Standing)});const pool=rr.Pool||[];for(const line of pool.slice(1)){const a=players(line[0]?.ParticipantCell);for(let j=1;j<line.length;j++){const m=line[j]?.MatchCell;if(m)add(m,a,players(pool[0]?.[j]?.ParticipantCell),m.MatchResults,m.Court);}}}for(const m of (item.Elimination?.DrawData||[]).flat()){if(m)add(m,players(m.ChallengerParticipant),players(m.ChallengedParticipant),m.MatchViewModel,m.CourtName);}}
}
function matchRow(m,finished){const r=m.r||{},sc=r.Score||{},winner=r.IsFirstParticipantWinner??sc.IsFirstParticipantWinner;const a=finished&&winner===true?'<b class="winner">'+safe(m.a)+'</b>':safe(m.a),b=finished&&winner===false?'<b class="winner">'+safe(m.b)+'</b>':safe(m.b);const detail=(sc.DetailedScoring||[]).map(g=>`${g.FirstParticipantScore}:${g.SecondParticipantScore}`).join(' · ');return `<div class="entry"><b>${safe(m.court||'—')}</b><span><small>${safe(m.category)} · ${safe(m.stage)}</small> ${a} — ${b}</span><b>${finished?safe(sc.FirstParticipantScore??'—')+'–'+safe(sc.SecondParticipantScore??'—')+(detail?'<br><small>'+safe(detail)+'</small>':''):safe(m.date?.slice(11,16)||'TBA')}</b></div>`;}
async function drawFetch(path,params){const base=(config.drawsApiBaseUrl||'https://api.rankedin.com/v1/tournament').replace(/\/$/,'');const r=await fetch(base+'/'+path+'?'+new URLSearchParams(params),{signal:AbortSignal.timeout(12000),cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(!Array.isArray(data))throw Error('Unexpected API response');return data;}
async function refreshDraws(){if(drawBusy)return;drawBusy=true;try{const id=config.tournamentId;if(!id)throw Error('Set tournamentId in api-config.json');const classes=await drawFetch('GetClassesAndDrawNamesAsync/',{tournamentId:id});const jobs=classes.filter(c=>c.IsPublished!==false).flatMap(c=>(c.TournamentDraws||[]).map(d=>({c,d})));const groups=[],matches=new Map();const data=await Promise.all(jobs.map(async({c,d})=>({c,d,items:await drawFetch('GetDrawsForStageAndStrengthAsync',{tournamentClassId:c.Id,drawStrength:d.Strength,drawStage:d.Stage,isReadonly:true,language:'en'})})));for(const {c,d,items} of data)parseDraws(c,d,items,groups,matches);const all=[...matches.values()];resultsItems=all.filter(m=>m.r?.IsPlayed&&m.r?.HasScore).sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(m=>matchRow(m,true));scheduleItems=all.filter(m=>!m.r?.IsPlayed&&!m.r?.HasCancellation&&m.date).sort((a,b)=>a.date.localeCompare(b.date)).map(m=>matchRow(m,false));groupPages=groups.flatMap(g=>{const out=[];for(let i=0;i<g.rows.length;i+=8)out.push({...g,rows:g.rows.slice(i,i+8)});return out;});drawReady=true;drawError='';$('resultSource').textContent='Rankedin Draws';show();}catch(e){drawError='Draws unavailable: '+e.message;$('resultSource').textContent=drawReady?'Rankedin Draws · cached':'Court feed · partial history';if(!$('groups').classList.contains('hide'))drawGroups();}finally{drawBusy=false;}}
function drawGroups(){groupPage=Math.min(groupPage,Math.max(0,groupPages.length-1));const g=groupPages[groupPage];$('groupsPage').textContent=g?`${groupPage+1} / ${groupPages.length}`:'';$('groupRows').innerHTML=(drawError?'<small>'+safe(drawError)+'</small>':'')+(g?`<h3 class="group-title">${safe(g.title)}</h3><table class="group-table"><thead><tr>${['#','PLAYER','P','W','L','GAMES','POINTS','PTS'].map(x=>'<th>'+x+'</th>').join('')}</tr></thead><tbody>${g.rows.map(r=>'<tr>'+[r.Standing,r.ParticipantName,r.Played,r.Wins,r.Losses,`${r.GamesWon}:${r.GamesLost}`,`${r.ScoredPoints}:${r.ConcededPoints}`,r.MatchPoints].map(x=>'<td>'+safe(x)+'</td>').join('')+'</tr>').join('')}</tbody></table>`:'<p>No group standings available</p>');}
function startDraws(){show();refreshDraws();setInterval(refreshDraws,Math.max(15,Number(config.groupStandings?.refreshSeconds)||30)*1000);}
async function startAds(){try{const r=await fetch('tv-ads.json',{cache:'no-store'});if(!r.ok)return;const a=await r.json();if(!a.enabled||!a.banners?.length)return;let i=0;const next=()=>{const b=a.banners[i++%a.banners.length];const img=$('tvAd').querySelector('img');img.onload=()=>$('tvAd').classList.remove('hide');img.onerror=()=>$('tvAd').classList.add('hide');img.src=typeof b==='string'?b:b.image||b.src;};next();setInterval(next,Math.max(3,Number(a.rotationSeconds)||15)*1000);}catch{}}

init();
</script></body></html>
