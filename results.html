<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament Live Center</title><style>
:root{font-family:Arial,sans-serif;color:#f4f8ff;background:#0b1422}*{box-sizing:border-box}body{margin:0;padding:2vw}header,footer,.top{display:flex;align-items:center;justify-content:space-between;gap:18px}header{border-bottom:1px solid #304259;padding-bottom:16px;margin-bottom:20px}h1{font-size:clamp(24px,3vw,52px);margin:5px 0}h2{font-size:clamp(20px,2vw,32px)}small,.muted{color:#a8bed5}.pill{background:#194a39;color:#92f2c2;padding:9px 16px;border-radius:18px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.court,.panel{background:#17263a;border:1px solid #2a4059;border-radius:13px;padding:20px}.court h3{margin:0 0 18px;color:#b4d0ec}.names{display:grid;grid-template-columns:1fr auto;gap:14px;font-size:clamp(16px,1.6vw,29px)}.score{font-weight:800}.points{font-size:clamp(20px,2.6vw,42px);text-align:center;color:#f7ce68;margin-top:12px}.state{font-size:13px;color:#a8bed5;text-transform:uppercase}.panel{margin-top:20px}.entry{display:grid;grid-template-columns:90px 1fr auto;gap:15px;padding:12px 0;border-bottom:1px solid #33475e;font-size:clamp(16px,1.35vw,24px)}.entry:last-child{border:0}.hide{display:none}footer{margin-top:20px;color:#9cb4cc;font-size:14px}button{border:1px solid #405873;background:#243c56;color:white;padding:10px 14px;border-radius:8px;cursor:pointer}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.entry{grid-template-columns:60px 1fr auto}}
</style></head><body><header><div><small>TOURNAMENT INFORMATION SYSTEM</small><h1 id="title">SQUASH LIVE CENTER</h1></div><div><span class="pill">● LIVE</span><p class="muted" id="status">Connecting…</p><button id="full">Fullscreen</button></div></header><main><section id="live"><h2>LIVE COURTS</h2><div class="grid" id="courts"></div></section><section class="panel" id="results"><div class="top"><h2>LATEST RESULTS</h2><small>Most recent match per court</small></div><div id="resultRows"></div></section><section class="panel" id="schedule"><h2>UPCOMING MATCHES</h2><div id="scheduleRows"></div></section></main><footer><span id="organizers"></span><span>POWERED BY RANKEDIN · <span id="clock"></span></span></footer><script>
'use strict';
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let config=null,records=new Map(),mode=0,rotation=true;
const name=p=>{const v=(Array.isArray(p)?p:[]).map(x=>[x.firstName,x.middleName,x.lastName].filter(Boolean).join(' ')).join(' / ').trim();return !v||/^(TBA|Pending)$/i.test(v)?'To Be Announced':v};
const score=m=>m?.score?`${m.score.firstParticipantScore??0}–${m.score.secondParticipantScore??0}`:'—';
const row=(c,m,suffix='')=>`<div class="entry"><b>Court ${safe(c)}</b><span>${safe(m.className||'')} · ${safe(name(m.firstParticipant))} — ${safe(name(m.secondParticipant))}</span><b>${safe(suffix||score(m))}</b></div>`;
async function init(){try{const [a,t]=await Promise.all([fetch('api-config.json?x='+Date.now(),{cache:'no-store'}),fetch('tournament.json?x='+Date.now(),{cache:'no-store'})]);if(!a.ok)throw Error('Configuration unavailable');config=await a.json();if(t.ok){const info=await t.json();$('title').textContent=info.tournamentName||'SQUASH LIVE CENTER';const logos=Array.isArray(info.organizers)?info.organizers:[];$('organizers').innerHTML=logos.map(x=>`<img src="${encodeURI(x).replace(/"/g,'%22')}" alt="Organizer" style="height:38px;max-width:180px;object-fit:contain;margin-right:15px">`).join('')}await refresh();setInterval(refresh,Math.max(3,Number(config.refreshSeconds)||5)*1000)}catch(e){$('status').textContent=e.message}}
async function refresh(){const active=Object.entries(config.courts||{}).filter(([,id])=>id!==null&&id!==undefined&&id!=='');let errors=0;await Promise.all(active.map(async([court,id])=>{try{const r=await fetch(`${String(config.apiBaseUrl).replace(/\/$/,'')}/court/${encodeURIComponent(id)}/scoreboard`,{cache:'no-store'});if(!r.ok)throw Error(r.status);records.set(court,await r.json())}catch(e){errors++}}));render(active);$('status').textContent=`Updated ${new Date().toLocaleTimeString()} · ${errors?errors+' court(s) unavailable':'All connected'}`}
function render(active){$('courts').innerHTML=active.map(([court])=>{const d=records.get(court),m=d?.liveMatch||d?.previousMatch||d?.nextMatch;const state=d?.liveMatch?'PLAYING':d?.nextMatch?'NEXT MATCH':d?.previousMatch?'FINISHED':'COURT AVAILABLE';return `<article class="court"><h3>COURT ${safe(court)}</h3><div class="state">${state}${!d?' · NO DATA':''}</div>${m?`<div class="names"><span>${safe(name(m.firstParticipant))}</span><span class="score">${safe(m.score?.firstParticipantScore??'–')}</span><span>${safe(name(m.secondParticipant))}</span><span class="score">${safe(m.score?.secondParticipantScore??'–')}</span></div><div class="points">${d?.liveMatch&&m.score?.detailedResult?.length?(()=>{const g=m.score.detailedResult.at(-1);return safe(`${g.firstParticipantScore??'–'} : ${g.secondParticipantScore??'–'}`)})():''}</div>`:''}</article>`}).join('')||'<p>No courts configured</p>';
const seen=new Set(),results=[],upcoming=[];for(const [court] of active){const d=records.get(court);if(d?.previousMatch){const m=d.previousMatch,k=m.matchId??`${court}-${name(m.firstParticipant)}-${name(m.secondParticipant)}`;if(!seen.has(k)){seen.add(k);results.push(row(court,m))}}if(d?.nextMatch)upcoming.push(row(court,d.nextMatch,'NEXT'))}$('resultRows').innerHTML=results.join('')||'<p class="muted">No recent results available</p>';$('scheduleRows').innerHTML=upcoming.join('')||'<p class="muted">No upcoming matches available</p>'}
function rotate(){if(!rotation)return;mode=(mode+1)%3;const ids=['live','results','schedule'];ids.forEach((id,i)=>$(id).classList.toggle('hide',i!==mode))}setInterval(rotate,20000);$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('clock').textContent=new Date().toLocaleString();setInterval(()=>$('clock').textContent=new Date().toLocaleString(),1000);init();
</script></body></html>
